# 密码、令牌和Authorization信息禁止写入本文件，运行时会隐藏输入。
target:
  type: security
  host: 192.168.10.30
  port: 22
  username: collector
  security_device: modsecurity
  use_sudo: true
  # 默认false并校验~/.ssh/known_hosts；仅在隔离靶场确认风险后设为true。
  trust_new_host_key: false

security_devices:
  modsecurity:
    # 不配置paths时自动使用适配器内置路径。
    paths:
      - /etc/modsecurity
      - /etc/nginx/modsecurity
